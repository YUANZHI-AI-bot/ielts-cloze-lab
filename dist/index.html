<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a43" />
    <meta name="description" content="输入雅思词汇，生成例句并通过挖空输入练习拼写。" />
    <title>IELTS Cloze Lab</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23102a43'/%3E%3Cpath d='M17 16h30v7H37v25h-9V23H17z' fill='%23e7b75f'/%3E%3C/svg%3E" />
    <style>
      :root { --ink:#102a43; --muted:#64748b; --paper:#f7f6f1; --card:#fff; --line:#dfe6ee; --gold:#e7b75f; --coral:#d96c5f; --green:#13866b; }
      * { box-sizing:border-box; }
      body { margin:0; min-width:320px; color:var(--ink); background:var(--paper); font:16px/1.55 ui-rounded, "SF Pro Rounded", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
      button, input, select { font:inherit; }
      button { cursor:pointer; }
      .page { width:min(1160px, calc(100% - 32px)); margin:0 auto; padding:28px 0 54px; }
      header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:30px; }
      .brand { display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:-.03em; font-size:1.22rem; }
      .mark { display:grid; place-items:center; width:38px; height:38px; border-radius:12px; color:#fff; background:var(--ink); box-shadow:0 6px 16px #102a4322; font-family:Georgia,serif; font-size:1.35rem; }
      .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.9rem; }
      .dot { width:9px; height:9px; border-radius:50%; background:var(--green); }
      .intro { display:grid; grid-template-columns:1.2fr .8fr; gap:22px; align-items:stretch; margin-bottom:22px; }
      .title-panel { padding:22px 4px; }
      h1 { margin:0 0 10px; max-width:680px; font-size:clamp(2rem, 4vw, 3.35rem); line-height:1.05; letter-spacing:-.06em; }
      .title-panel p { max-width:620px; margin:0; color:var(--muted); font-size:1.05rem; }
      .stats { display:grid; grid-template-columns:repeat(3, 1fr); border:1px solid var(--line); border-radius:20px; overflow:hidden; background:#fffdf9; box-shadow:0 12px 30px #102a0a0c; }
      .stat { padding:22px 16px; border-left:1px solid var(--line); text-align:center; }
      .stat:first-child { border-left:0; }
      .stat strong { display:block; font-size:1.8rem; line-height:1.15; letter-spacing:-.06em; }
      .stat span { color:var(--muted); font-size:.82rem; }
      .grid { display:grid; grid-template-columns:365px minmax(0, 1fr); gap:22px; align-items:start; }
      .panel { border:1px solid var(--line); border-radius:20px; background:var(--card); box-shadow:0 12px 32px #102a4308; }
      .builder { padding:22px; }
      h2 { margin:0; font-size:1.12rem; letter-spacing:-.025em; }
      .hint { color:var(--muted); font-size:.9rem; margin:5px 0 18px; }
      label { display:block; margin:15px 0 6px; font-weight:700; font-size:.9rem; }
      input, select { width:100%; min-height:47px; padding:10px 12px; color:var(--ink); background:#fff; border:1px solid #cbd5e1; border-radius:11px; outline:none; }
      input:focus, select:focus { border-color:var(--ink); box-shadow:0 0 0 3px #102a4318; }
      .primary { width:100%; margin-top:18px; min-height:48px; border:0; border-radius:12px; color:#fff; background:var(--ink); font-weight:800; transition:transform .15s, background .15s; }
      .primary:hover { transform:translateY(-1px); background:#183d60; }
      .note { margin:16px 0 0; color:var(--muted); font-size:.78rem; }
      .practice { min-height:480px; overflow:hidden; }
      .practice-top { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--line); background:#fcfcfa; }
      .pill { display:inline-flex; align-items:center; padding:4px 9px; border-radius:999px; color:#496071; background:#e8f0f3; font-size:.78rem; font-weight:800; }
      .word-tag { color:#8a6018; background:#fff3d5; }
      .lesson { padding:38px clamp(22px, 5vw, 54px); }
      .sentence { min-height:122px; margin:0 0 26px; font-family:Georgia, "Times New Roman", serif; font-size:clamp(1.55rem, 3.1vw, 2.45rem); line-height:1.45; letter-spacing:-.02em; }
      .blank { display:inline-block; min-width:4.4em; height:1.05em; margin:0 .06em; vertical-align:-.06em; border-bottom:3px solid var(--gold); }
      .answer-row { display:flex; gap:10px; }
      .answer-row input { flex:1; min-width:0; font-size:1.05rem; }
      .check { flex:0 0 auto; padding:0 19px; border:0; border-radius:11px; color:#fff; background:var(--coral); font-weight:800; }
      .check:hover { background:#bd554b; }
      .feedback { min-height:29px; margin:12px 0 0; font-weight:700; }
      .feedback.ok { color:var(--green); }
      .feedback.no { color:#b6463c; }
      .actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:30px; padding-top:20px; border-top:1px solid var(--line); }
      .audio, .next { min-height:42px; padding:0 14px; border-radius:10px; font-weight:750; }
      .audio { color:var(--ink); border:1px solid var(--line); background:#fff; }
      .next { color:#fff; border:0; background:var(--ink); }
      .audio:disabled, .next:disabled { opacity:.45; cursor:not-allowed; }
      .deck { margin-top:22px; padding:20px 22px; }
      .deck-header { display:flex; align-items:center; justify-content:space-between; gap:14px; }
      .clear { border:0; padding:5px; color:var(--muted); background:transparent; font-size:.82rem; text-decoration:underline; }
      .word-list { display:flex; flex-wrap:wrap; gap:8px; margin:15px 0 0; }
      .chip { display:flex; align-items:center; gap:7px; padding:6px 8px 6px 10px; border:1px solid var(--line); border-radius:999px; background:#fbfcfe; font-size:.88rem; }
      .chip button { width:18px; height:18px; border:0; border-radius:50%; color:#76879a; background:#e9eff3; line-height:16px; }
      .empty { color:var(--muted); font-size:.9rem; }
      @media (max-width:800px) { .intro,.grid { grid-template-columns:1fr; } .title-panel{ padding-top:0; } .practice { min-height:0; } }
      @media (max-width:490px) { .page{ width:min(100% - 22px, 1160px); padding-top:16px; } header{ margin-bottom:21px; } .status{ font-size:.78rem; } .stats{ border-radius:15px; } .stat{ padding:15px 9px; } .stat strong{ font-size:1.45rem; } .builder{ padding:18px; } .practice-top{ padding:15px 18px; } .lesson{ padding:30px 20px; } .answer-row{ flex-direction:column; } .check{ min-height:46px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div class="brand"><span class="mark">T</span> IELTS Cloze Lab</div>
        <div class="status"><span class="dot"></span><span>你的卡片只保存在这台设备</span></div>
      </header>
      <section class="intro">
        <div class="title-panel"><h1>把背诵，变成真正的输出。</h1><p>输入一个词，生成英文例句；挖空、键入、答对后听完整句子。每张卡片都在你的浏览器里。</p></div>
        <div class="stats" aria-label="学习统计"><div class="stat"><strong id="statWords">1</strong><span>词汇卡</span></div><div class="stat"><strong id="statCorrect">0</strong><span>答对次数</span></div><div class="stat"><strong id="statStreak">0</strong><span>当前连对</span></div></div>
      </section>
      <section class="grid">
        <aside class="panel builder">
          <h2>新建词汇卡</h2><p class="hint">输入你想背的词或短语，选择它在句子中的用法。</p>
          <label for="wordInput">单词 / 短语</label><input id="wordInput" autocomplete="off" placeholder="例如: sustainable" value="sustainable" />
          <label for="roleInput">词性</label><select id="roleInput"><option value="adjective">形容词</option><option value="noun">名词</option><option value="verb">动词</option><option value="phrase">短语 / 其他</option></select>
          <label for="topicInput">雅思话题</label><select id="topicInput"><option value="environment">环境</option><option value="education">教育</option><option value="technology">科技</option><option value="society">社会</option></select>
          <button class="primary" id="generateBtn" type="button">生成例句并开始练习</button>
          <p class="note">例句由内置学习模板即时生成，不上传你的词汇。自然语言 AI 出句可在后续接入服务端密钥。</p>
        </aside>
        <section>
          <article class="panel practice" aria-live="polite">
            <div class="practice-top"><span class="pill">填空练习</span><span class="pill word-tag" id="topicPill">环境话题</span></div>
            <div class="lesson">
              <p class="sentence" id="sentence" lang="en"></p>
              <form class="answer-row" id="answerForm"><input id="answerInput" aria-label="输入缺失单词" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入缺失的英文单词" /><button class="check" type="submit">检查</button></form>
              <p class="feedback" id="feedback" role="status"></p>
              <div class="actions"><button class="audio" id="audioBtn" type="button" aria-label="朗读完整句子">🔊 朗读完整句子</button><button class="next" id="nextBtn" type="button">下一张 →</button></div>
            </div>
          </article>
          <section class="panel deck"><div class="deck-header"><h2>我的词汇卡</h2><button class="clear" id="clearBtn" type="button">清空本机卡片</button></div><div class="word-list" id="wordList"></div></section>
        </section>
      </section>
    </main>
    <script>
      const KEY = 'ielts-cloze-lab-v1';
      const topicNames = { environment:'环境', education:'教育', technology:'科技', society:'社会' };
      const topicTails = {
        environment: { noun:'can help protect natural resources for future generations.', adjective:'urban planning is essential for protecting natural resources.', verb:'governments should do more to protect natural resources for future generations.', phrase:'is a key consideration when cities plan for future growth.' },
        education: { noun:'can broaden students\' understanding of the world.', adjective:'teaching methods can encourage students to think independently.', verb:'schools should help students think independently and communicate clearly.', phrase:'can give students more confidence in academic discussions.' },
        technology: { noun:'is changing how people work and communicate every day.', adjective:'digital tools can make complex information easier to access.', verb:'new tools can help people work more efficiently and accurately.', phrase:'is becoming increasingly important in modern workplaces.' },
        society: { noun:'plays an important role in creating inclusive communities.', adjective:'public policies can support stronger and more inclusive communities.', verb:'communities should work together to solve local problems.', phrase:'can improve the quality of life in local communities.' }
      };
      const starter = { word:'sustainable', role:'adjective', topic:'environment', correct:0, attempts:0 };
      let state = JSON.parse(localStorage.getItem(KEY) || 'null') || { cards:[starter], active:0, streak:0 };
      const el = id => document.getElementById(id);
      function sentenceFor(card) {
        const word = card.word.trim(); const tail = topicTails[card.topic][card.role];
        if (card.role === 'noun') return `The ${word} ${tail}`;
        if (card.role === 'adjective') return `${word.charAt(0).toUpperCase() + word.slice(1)} ${tail}`;
        if (card.role === 'verb') return `To ${word}, ${tail}`;
        return `In IELTS discussions, ${word} ${tail}`;
      }
      function activeCard() { return state.cards[state.active] || state.cards[0]; }
      function answerInSentence(sentence, word) {
        const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return sentence.replace(new RegExp(escaped, 'i'), match => `<span class="blank" aria-label="缺失单词"></span>`);
      }
      function normalize(value) { return value.trim().toLowerCase().replace(/[.,;:!?]/g, '').replace(/\s+/g, ' '); }
      function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
      function renderStats() {
        el('statWords').textContent = state.cards.length;
        el('statCorrect').textContent = state.cards.reduce((sum, card) => sum + (card.correct || 0), 0);
        el('statStreak').textContent = state.streak || 0;
      }
      function renderDeck() {
        const list = el('wordList'); list.innerHTML = '';
        if (!state.cards.length) { list.innerHTML = '<span class="empty">还没有词汇卡。先输入一个单词吧。</span>'; return; }
        state.cards.forEach((card, index) => { const chip = document.createElement('span'); chip.className='chip'; chip.innerHTML=`<span lang="en">${card.word}</span><button type="button" aria-label="删除 ${card.word}">×</button>`; chip.querySelector('span').onclick=()=>{state.active=index; save(); render();}; chip.querySelector('button').onclick=()=>removeCard(index); list.appendChild(chip); });
      }
      function render() {
        if (!state.cards.length) { el('sentence').textContent='输入一个单词，开始你的第一张卡片。'; el('topicPill').textContent='等待开始'; el('answerInput').disabled=true; el('audioBtn').disabled=true; el('nextBtn').disabled=true; renderStats(); renderDeck(); return; }
        if (state.active >= state.cards.length) state.active=0;
        const card=activeCard(), sentence=sentenceFor(card); el('sentence').innerHTML=answerInSentence(sentence, card.word); el('topicPill').textContent=topicNames[card.topic]+'话题'; el('answerInput').disabled=false; el('audioBtn').disabled=false; el('nextBtn').disabled=false; el('answerInput').value=''; el('feedback').textContent=''; el('feedback').className='feedback'; renderStats(); renderDeck();
      }
      function speak() {
        const card=activeCard(); if (!card || !('speechSynthesis' in window)) { el('feedback').textContent='这台设备暂不支持浏览器朗读。'; el('feedback').className='feedback no'; return; }
        speechSynthesis.cancel(); const utterance=new SpeechSynthesisUtterance(sentenceFor(card)); utterance.lang='en-GB'; utterance.rate=.82; utterance.pitch=1; const voices=speechSynthesis.getVoices(); const voice=voices.find(v=>/^en-GB/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang)); if (voice) utterance.voice=voice; speechSynthesis.speak(utterance);
      }
      function checkAnswer(event) {
        event.preventDefault(); const card=activeCard(), input=normalize(el('answerInput').value), expected=normalize(card.word); if (!input) { el('feedback').textContent='先输入你认为缺失的单词。'; el('feedback').className='feedback no'; return; } card.attempts=(card.attempts||0)+1;
        if (input===expected) { card.correct=(card.correct||0)+1; state.streak=(state.streak||0)+1; el('feedback').textContent='答对了！现在听完整的句子。'; el('feedback').className='feedback ok'; save(); renderStats(); speak(); } else { state.streak=0; el('feedback').textContent=`还差一点。提示：这个答案有 ${[...card.word].length} 个字符。`; el('feedback').className='feedback no'; save(); renderStats(); }
      }
      function nextCard() { if (!state.cards.length) return; state.active=(state.active+1)%state.cards.length; save(); render(); el('answerInput').focus(); }
      function createCard() {
        const word=el('wordInput').value.trim(); if (!word) { el('wordInput').focus(); return; }
        const card={word, role:el('roleInput').value, topic:el('topicInput').value, correct:0, attempts:0}; const existing=state.cards.findIndex(item=>normalize(item.word)===normalize(word)); if(existing>=0) state.cards[existing]=card; else state.cards.unshift(card); state.active=0; save(); render(); el('answerInput').focus();
      }
      function removeCard(index) { state.cards.splice(index,1); if(state.active>=state.cards.length) state.active=Math.max(0,state.cards.length-1); save(); render(); }
      el('generateBtn').onclick=createCard; el('answerForm').onsubmit=checkAnswer; el('audioBtn').onclick=speak; el('nextBtn').onclick=nextCard; el('clearBtn').onclick=()=>{ if(confirm('确定清空这台设备上的全部词汇卡吗？')) { state={cards:[],active:0,streak:0}; save(); render(); } }; if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{}; render();
    </script>
  </body>
</html>
