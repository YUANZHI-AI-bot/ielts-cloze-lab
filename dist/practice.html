<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b16"><title>IELTS Cloze Lab · 拼写</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="practice"><main class="practice-shell"><header class="topbar"><a class="brand" href="index.html"><b>⌁</b><span>IELTS Cloze Lab</span></a><a class="back" href="index.html">← 返回词库</a></header><section class="practice-layout"><aside class="practice-side panel"><p class="eyebrow">ACTIVE RECALL</p><h1>拼写，而非选择。</h1><p>看中文提示和语境，在输入框里写出完整英文。按 <kbd>Enter</kbd> 核验。</p><div class="side-stat"><span>连续答对</span><b id="sideStreak">0</b></div><div class="side-stat"><span>待复习</span><b id="sideDue">0</b></div><div class="settings"><label><input id="typeSound" type="checkbox">机械键盘音效</label><label><input id="autoRead" type="checkbox" checked>答对后自然朗读</label></div></aside>
<section class="practice-card panel" id="practiceCard" aria-live="polite"><div class="card-top"><div><span class="pill">第 <b id="progressNo">1</b> 题</span><span class="pill purple" id="topicPill">环境</span></div><button id="favoriteBtn" class="star" type="button" aria-label="收藏这个词">☆</button></div><div class="prompt"><p class="eyebrow">中文词义提示</p><strong id="glossHint">—</strong></div><p id="sentence" class="sentence" lang="en"></p><div class="translation-box"><p class="eyebrow">整句中文提示</p><p id="translation">—</p></div><form id="answerForm"><label for="answerInput">写出空缺的英文单词</label><div class="answer-row"><input id="answerInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入答案后按 Enter" autofocus><button class="primary" type="submit">核验 <kbd>Enter</kbd></button></div></form><p id="feedback" class="feedback" role="status"></p><footer class="card-footer"><button id="audioBtn" class="soft" type="button">🔊 朗读单词与句子</button><button id="nextBtn" class="text-button" type="button">跳过 / 下一题 →</button><span id="voiceStatus">优先使用设备上的自然英音</span></footer><div id="reward" class="reward" aria-hidden="true"><div></div><span>CORRECT</span></div></section></section></main><div class="toast" id="toast" role="status"></div><script src="app.js"></script></body></html>
